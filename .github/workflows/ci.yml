name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Suite and build
        shell: pwsh
        run: ./build.ps1 -Zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeGraft-win-x64
          path: dist/*.zip
